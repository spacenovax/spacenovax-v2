name: Build Genesis Community Node V1.1

on:
  workflow_dispatch:
  push:
    paths:
      - community-node/agent.mjs
      - community-node/RESET_NODE_PAIRING.cmd
      - .github/workflows/build-community-node-v1.1.yml

permissions:
  contents: write

jobs:
  windows-node:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Compile Windows standalone node
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force node-release | Out-Null
          bun build community-node/agent.mjs --compile --target=bun-windows-x64 --outfile node-release/SpaceNovaX_Node.exe
          Copy-Item community-node/RESET_NODE_PAIRING.cmd node-release/
          Copy-Item community-node/README_KR.md node-release/
          Copy-Item community-node/INSTALL_GUIDE_KR.md node-release/
          Set-Content node-release/VERSION.txt "SpaceNovaX Genesis Community Node V1.1.0"
          Compress-Archive -Path node-release/* -DestinationPath Genesis_Community_Node_V1.1_Windows_x64.zip -Force
          Get-FileHash Genesis_Community_Node_V1.1_Windows_x64.zip -Algorithm SHA256 | Format-List
      - uses: actions/upload-artifact@v4
        with:
          name: Genesis_Community_Node_V1.1_Windows_x64
          path: Genesis_Community_Node_V1.1_Windows_x64.zip
          if-no-files-found: error
      - name: Publish V1.1 release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = @"
          # SpaceNovaX Genesis Community Node V1.1

          Windows 10/11 standalone community node supporting public service work for Navigation, NOVA AI, NOVA-X and the SPNX network.

          ## Public node work
          - Navigation satellite, weather and route-gateway monitoring
          - NOVA AI public help cache and service-health monitoring
          - NOVA-X gateway, public ranking and asset-integrity verification
          - SPNX public missions, ranking and 12-language cache
          - Heartbeat, uptime, latency and SHA-256 console output
          - Automatic reconnection and +25% mining-speed status

          The node cannot access balances, wallets, mining ledgers, KYC, private conversations, precise location history or administrator data.
          "@
          gh release delete node-v1.1.0 --yes --cleanup-tag 2>$null
          gh release create node-v1.1.0 Genesis_Community_Node_V1.1_Windows_x64.zip --title "SpaceNovaX Genesis Community Node V1.1" --notes $notes --target main --latest
